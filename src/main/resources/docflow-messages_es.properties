#Éxito - 2xx
docflow.codes.200=La operación se ha realizado correctamente.
docflow.codes.201=La función se ha creado correctamente.
docflow.codes.204=La operación se ha realizado correctamente. No se ha devuelto ningún contenido.

#Error de cliente - 4xx
docflow.codes.400=Errores generales debidos a una solicitud mal formada (JSON no válido, error de sintaxis).
docflow.codes.401=El usuario no ha iniciado sesión en la API.
docflow.codes.403=El usuario no tiene permiso para acceder a este recurso.
docflow.codes.404=No se encuentra el recurso solicitado.
docflow.codes.409=Conflicto de estado del recurso (datos ya almacenados en el servidor).
docflow.codes.422=Errores de validación de reglas de negocio o de campos.

#Error de servidor - 5xx
docflow.codes.500=Error interno del servidor.

#-----------------------------------------------------------
#CÓDIGOS HTTP 200 Y 204
docflow.action.updated=La función se ha actualizado correctamente.
docflow.action.deleted=La función se ha eliminado correctamente.
docflow.action.nocontent=No se ha devuelto ningún contenido.

#Descripción
docflow.auto.description=Endpoint responsable de {0}.