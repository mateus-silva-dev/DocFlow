#Succès - 2xx
docflow.codes.200=L'opération a réussi.
docflow.codes.201=La fonctionnalité a été créée avec succès.
docflow.codes.204=L'opération a réussi. Aucun contenu renvoyé.

#Erreur client - 4xx
docflow.codes.400=Erreurs générales dues à une requête mal formée (JSON non valide, erreur de syntaxe).
docflow.codes.401=L'utilisateur n'est pas connecté à l'API.
docflow.codes.403=L'utilisateur n'a pas l'autorisation d'accéder à cette ressource.
docflow.codes.404=La ressource demandée est introuvable.
docflow.codes.409=Conflit d'état de la ressource (données déjà stockées sur le serveur).
docflow.codes.422=Erreurs de validation des règles métier ou des champs.

#Erreur serveur - 5xx
docflow.codes.500=Erreur interne du serveur.

#-----------------------------------------------------------
#CODES HTTP 200 ET 204
docflow.action.updated=La fonctionnalité a été mise à jour avec succès.
docflow.action.deleted=La fonctionnalité a été supprimée avec succès.
docflow.action.nocontent=Aucun contenu renvoyé.

#Description
docflow.auto.description=Endpoint responsable de {0}.