#Success - 2xx
docflow.codes.200=L'opération a réussi.
docflow.codes.201=La ressource a été créée avec succès.
docflow.codes.204=L'opération a réussi. Aucun contenu renvoyé.

#Error Client - 4xx
docflow.codes.400=Erreurs générales dues à une requête mal formée (JSON invalide, erreur de syntaxe).
docflow.codes.401=L'utilisateur n'est pas authentifié sur l'API.
docflow.codes.403=L'utilisateur n'a pas la permission d'accéder à cette ressource.
docflow.codes.404=La ressource demandée est introuvable.
docflow.codes.409=Conflit d'état de la ressource (données déjà stockées sur le serveur).
docflow.codes.422=Erreurs de validation des règles métier ou des champs.

#Server Error - 5xx
docflow.codes.500=Erreur interne du serveur.

#Description
docflow.auto.description=Point de terminaison responsable de {0}.