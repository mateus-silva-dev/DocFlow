#Success - 2xx
docflow.codes.200=Операция выполнена успешно.
docflow.codes.201=Ресурс успешно создан.
docflow.codes.204=Операция выполнена успешно. Нет возвращаемого содержимого.

#Error Client - 4xx
docflow.codes.400=Общие ошибки из-за неверного запроса (недопустимый JSON, синтаксическая ошибка).
docflow.codes.401=Пользователь не авторизован в API.
docflow.codes.403=У пользователя нет прав на доступ к этому ресурсу.
docflow.codes.404=Запрашиваемый ресурс не найден.
docflow.codes.409=Конфликт состояния ресурса (данные уже сохранены на сервере).
docflow.codes.422=Ошибки проверки бизнес-правил или полей.

#Server Error - 5xx
docflow.codes.500=Внутренняя ошибка сервера.

#Description
docflow.auto.description=Конечная точка, отвечающая за {0}.