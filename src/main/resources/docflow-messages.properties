#Success - 2xx
docflow.codes.200=The operation was successful.
docflow.codes.201=The feature was successfully created.
docflow.codes.204=The operation was successful. No content returned.

#Error Client - 4xx
docflow.codes.400=General errors due to a malformed request (invalid JSON, syntax error).
docflow.codes.401=The user is not logged in to the API.
docflow.codes.403=The user does not have permission to access this resource.
docflow.codes.404=The requested resource cannot be found.
docflow.codes.409=Resource status conflict (data that is already stored on the server).
docflow.codes.422=Business rule validation errors or field validation errors.

#Server Error - 5xx
docflow.codes.500=Internal server error.

#-----------------------------------------------------------
#HTTP CODE 200 AND 204
docflow.action.updated=The feature was successfully updated.
docflow.action.deleted=The feature was successfully deleted.
docflow.action.nocontent=No content returned.

#Description
docflow.auto.description=Endpoint responsible for {0}.