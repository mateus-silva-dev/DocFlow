#CÓDIGOS HTTP 200 E 204
docflow.action.updated=O recurso foi atualizado com sucesso.
docflow.action.deleted=O recurso foi removido com sucesso.
docflow.action.nocontent=Sem retorno de conteúdo.

#Descrição
docflow.auto.description=Endpoint responsável por {0}.