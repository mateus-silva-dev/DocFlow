#Sucesso - 2xx
docflow.codes.200=A operação foi bem-sucedida.
docflow.codes.201=O recurso foi criado com sucesso.
docflow.codes.204=A operação foi bem-sucedida. Nenhum conteúdo retornado.

#Erro do cliente - 4xx
docflow.codes.400=Erros gerais devido a uma solicitação malformada (JSON inválido, erro de sintaxe).
docflow.codes.401=O usuário não está conectado à API.
docflow.codes.403=O usuário não tem permissão para acessar este recurso.
docflow.codes.404=O recurso solicitado não foi encontrado.
docflow.codes.409=Conflito de status do recurso (dados já armazenados no servidor).
docflow.codes.422=Erros de validação de regras de negócios ou erros de validação de campos.

#Erro do servidor - 5xx
docflow.codes.500=Erro interno do servidor.

