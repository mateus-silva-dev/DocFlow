#Success - 2xx
docflow.codes.200=작업이 성공적으로 완료되었습니다.
docflow.codes.201=리소스가 성공적으로 생성되었습니다.
docflow.codes.204=작업이 성공적으로 완료되었습니다. 반환된 콘텐츠가 없습니다.

#Error Client - 4xx
docflow.codes.400=잘못된 요청으로 인한 일반 오류(잘못된 JSON, 구문 오류).
docflow.codes.401=사용자가 API에 인증되지 않았습니다.
docflow.codes.403=사용자가 이 리소스에 액세스할 권한이 없습니다.
docflow.codes.404=요청한 리소스를 찾을 수 없습니다.
docflow.codes.409=리소스 상태 충돌(이미 서버에 저장된 데이터).
docflow.codes.422=비즈니스 규칙 유효성 검사 오류 또는 필드 유효성 검사 오류.

#Server Error - 5xx
docflow.codes.500=내부 서버 오류입니다.

#Description
docflow.auto.description={0}을(를) 담당하는 엔드포인트입니다.