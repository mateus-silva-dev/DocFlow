#Success - 2xx
docflow.codes.200=操作は正常に完了しました。
docflow.codes.201=リソースが正常に作成されました。
docflow.codes.204=操作は正常に完了しました。コンテンツは返されません。

#Error Client - 4xx
docflow.codes.400=不正なリクエストによる一般的なエラー（無効なJSON、構文エラー）。
docflow.codes.401=ユーザーはAPIで認証されていません。
docflow.codes.403=ユーザーにはこのリソースにアクセスする権限がありません。
docflow.codes.404=要求されたリソースが見つかりませんでした。
docflow.codes.409=リソース状態の競合（すでにサーバーに保存されているデータ）。
docflow.codes.422=ビジネスルールの検証エラーまたはフィールドの検証エラー。

#Server Error - 5xx
docflow.codes.500=内部サーバーエラー。

#Description
docflow.auto.description={0} を担当するエンドポイント。