#成功 - 2xx
docflow.codes.200=操作成功。
docflow.codes.201=功能已成功创建。
docflow.codes.204=操作成功。未返回内容。

#客户端错误 - 4xx
docflow.codes.400=由于请求格式错误（无效的 JSON、语法错误）导致的一般性错误。
docflow.codes.401=用户未登录 API。
docflow.codes.403=用户无权访问此资源。
docflow.codes.404=找不到请求的资源。
docflow.codes.409=资源状态冲突（数据已在服务器上存储）。
docflow.codes.422=业务规则验证错误或字段验证错误。

#服务器错误 - 5xx
docflow.codes.500=内部服务器错误。

#-----------------------------------------------------------
#HTTP 状态码 200 和 204
docflow.action.updated=功能已成功更新。
docflow.action.deleted=功能已成功删除。
docflow.action.nocontent=未返回任何内容。

#描述
docflow.auto.description= 负责 {0} 的端点。