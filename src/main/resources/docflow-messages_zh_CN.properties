#Success - 2xx
docflow.codes.200=操作成功。
docflow.codes.201=资源已成功创建。
docflow.codes.204=操作成功。未返回任何内容。

#Error Client - 4xx
docflow.codes.400=请求格式错误导致的一般错误（无效的 JSON，语法错误）。
docflow.codes.401=用户未在 API 中进行身份验证。
docflow.codes.403=用户没有权限访问此资源。
docflow.codes.404=找不到请求的资源。
docflow.codes.409=资源状态冲突（服务器上已存在的数据）。
docflow.codes.422=业务规则验证错误或字段验证错误。

#Server Error - 5xx
docflow.codes.500=内部服务器错误。

#Description
docflow.auto.description=负责 {0} 的端点。