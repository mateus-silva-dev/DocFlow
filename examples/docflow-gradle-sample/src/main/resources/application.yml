springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.docflow.example.controller

docflow:
  title: "DocFlow API Example"
  description: "Practical demonstration of clean documentation with DocFlow"
  version: "1.0.0"
  default-error-schema: com.docflow.example.dto.StandardError
  security:
    enabled: true
    scheme-name: "JWT Authentication"